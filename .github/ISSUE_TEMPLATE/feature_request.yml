name: Feature request
description: Suggest something new
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you are in rather than the solution you
        have in mind. That usually leads somewhere better.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This could be implemented by someone new to the project
        - label: This needs deep WebRTC or networking knowledge
