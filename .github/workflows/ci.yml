name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the previous run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Detect unused dependencies and exports
        # knip is advisory: it flags real dead weight but should not block a
        # contributor's first PR.
        continue-on-error: true
        run: bun run knip

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test --coverage --coverage-reporter=lcov

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: packages/*/coverage/lcov.info
          if-no-files-found: ignore

  build:
    name: Build and container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run --filter @airdelivery/frontend build

      - name: Typecheck backend in isolation
        run: bun run --filter @airdelivery/backend typecheck

      # buildx has to be provisioned explicitly. Without this the action falls
      # back to the plain `docker` driver, which cannot export a cache — the
      # build fails with "Cache export is not supported for the docker driver"
      # rather than with anything about the image.
      - uses: docker/setup-buildx-action@v3

      - name: Build the signaling server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: false
          load: true
          tags: airdelivery/signal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name signal -p 5500:5500 airdelivery/signal:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5500/api/v1/health > /dev/null; then
              echo "healthy after ${i}s"
              curl -fsS http://127.0.0.1:5500/api/v1/health
              curl -fsS http://127.0.0.1:5500/api/v1/config | head -c 300
              docker rm -f signal
              exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy in 30s"
          docker logs signal
          docker rm -f signal
          exit 1

      - name: Verify graceful shutdown
        run: |
          # A SIGTERM must not hang. This is a regression test for the
          # unbounded server.close() that made every deploy a hard kill.
          docker run -d --name signal-shutdown -p 5501:5500 airdelivery/signal:ci
          sleep 5
          timeout 20 docker stop --signal SIGTERM signal-shutdown
          docker rm -f signal-shutdown

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - run: bun install --frozen-lockfile

      - name: Audit
        continue-on-error: true
        run: bun audit

  contributing:
    name: Contributor docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files exist
        run: |
          for f in CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md LICENSE .env.example; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done

      - name: No personal attribution in project surfaces
        run: |
          # The project is presented as a community effort. A stray personal
          # handle in the README or metadata reads as a single-maintainer
          # project and suppresses contributions.
          if grep -rniE 'imgochi|x\.com/[a-z0-9_]+|twitter\.com/[a-z0-9_]+' \
            README.md packages/frontend/app/layout.tsx packages/frontend/public 2>/dev/null; then
            echo "personal handle found in project surfaces"
            exit 1
          fi

      - name: Codeowners file is present
        run: test -f .github/CODEOWNERS
